services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: manufacturing-agent-backend

    env_file:
      - .env

    environment:
      BACKEND_URL: http://backend:8000

    ports:
      - "8000:8000"

    volumes:
      - ./data:/app/data
      - ./knowledge:/app/knowledge

    restart: unless-stopped


  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    container_name: manufacturing-agent-frontend

    environment:
      BACKEND_URL: http://backend:8000
      APP_API_KEY: ${APP_API_KEY}

    ports:
      - "8501:8501"

    depends_on:
      - backend

    restart: unless-stopped